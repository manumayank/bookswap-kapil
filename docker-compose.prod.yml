version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookswap-postgres
    restart: always
    environment:
      POSTGRES_USER: bookswap
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: bookswap_prod
    volumes:
      - bookswap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookswap -d bookswap_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookswap-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bookswap:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/bookswap_prod
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://sybrary.com
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      DEV_OTP_MODE: ${DEV_OTP_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      PINNACLE_API_URL: ${PINNACLE_API_URL:-https://wa.basiqcrm.com/}
      PINNACLE_API_KEY: ${PINNACLE_API_KEY:-}
      PINNACLE_MOBILE_NO: ${PINNACLE_MOBILE_NO:-}
      PINNACLE_USERNAME: ${PINNACLE_USERNAME:-}
      PINNACLE_PASSWORD: ${PINNACLE_PASSWORD:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://sybrary.com}
    volumes:
      - bookswap_uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bookswap-web
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: https://sybrary.com/api

  nginx:
    image: nginx:alpine
    container_name: bookswap-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web

volumes:
  bookswap_postgres_data:
  bookswap_uploads:
